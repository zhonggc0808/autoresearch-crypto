strategy: channel_breakout
candidate_role: standalone
description: "TODO: 描述这个实验的假设"

# --- standalone 候选：填写 params ---
params:
  bull:
    entry_lookback: 375
    min_hold_bars: 432
    enable_short: false
    # extra_conditions:
    #   - "连续3天close < EMA50 → 禁多"

  bear:
    entry_lookback: 375
    min_hold_bars: 432
    enable_short: true

  neutral:
    entry_lookback: 375
    min_hold_bars: 432
    enable_short: true
    # directional_only: true

execution:
  safe_reversal: true
  regime_filter:
    fast_days: 50
    slow_days: 200
  dd_guard: null
  # dd_guard:
  #   max_dd: 0.25
  #   recovery_dd: 0.15

